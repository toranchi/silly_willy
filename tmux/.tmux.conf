# https://tmate.io/  for remote session
# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-q
bind-key C-q send-prefix


# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off

# reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# List of plugins
# https://github.com/tmux-plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'


# pain control
# https://github.com/tmux-plugins/tmux-pain-control
# Navigation

#     prefix + h and prefix + C-h
#     select pane on the left
#     prefix + j and prefix + C-j
#     select pane below the current one
#     prefix + k and prefix + C-k
#     select pane above
#     prefix + l and prefix + C-l
#     select pane on the right

# Resizing panes

#     prefix + shift + h
#     resize current pane 5 cells to the left
#     prefix + shift + j
#     resize 5 cells in the down direction
#     prefix + shift + k
#     resize 5 cells in the up direction
#     prefix + shift + l
#     resize 5 cells to the right

# Splitting panes

#     prefix + |
#     split the current pane into two, left and right.
#     prefix + -
#     split the current pane into two, top and bottom.
#     prefix + \
#     split current pane full width into two, left and right.
#     prefix + _
#     split current pane full height into two, top and bottom.

# Swapping windows

#     prefix + < - moves current window one position to the left
#     prefix + > - moves current window one position to the right

set -g @plugin 'tmux-plugins/tmux-pain-control'


# copy to clipboard with y
set -g @plugin 'tmux-plugins/tmux-yank'


# quick select with CTRL-f and CTRL-g for git status
set -g @plugin 'tmux-plugins/tmux-copycat'


# sessionist
    # prefix + g - prompts for session name and switches to it. Performs 'kind-of' name completion.
    # Faster than the built-in prefix + s prompt for long session lists.
    # prefix + C (shift + c) - prompt for creating a new session by name.
    # prefix + X (shift + x) - kill current session without detaching tmux.
    # prefix + S (shift + s) - switches to the last session.
    # The same as built-in prefix + L that everyone seems to override with some other binding.
    # prefix + @ - promote current pane into a new session.
    # Analogous to how prefix + ! breaks current pane to a new window.
    # prefix + t<secondary-key> - join currently marked pane (prefix + m) to current session/window, and switch to it
    #     secondary-keys
    #         h, -, ": join horizontally
    #         v, |, %: join vertically
    #         f, @: join full screen
set -g @plugin 'tmux-plugins/tmux-sessionist'


# fzf session prefix + CTRL-F
# set -g @plugin 'thuanOwa/tmux-fzf-session-switch'
# set -g @fzf-goto-session 'a'

# prefix + TAB
# requires sudo apt-get install -y xclip
# fzf style search over tmux on screen data
# https://github.com/laktak/extrakto
set -g @plugin 'laktak/extrakto'


# tmux fzf prefix + F
set -g @plugpin 'sainnhe/tmux-fzf'


# tmux menu prefix + \
#set -g @plugin 'jaclu/tmux-menus'


# tmux Logging
# 1. Logging

# Toggle (start/stop) logging in the current pane.

#     Key binding: prefix + shift + p
#     File name format: tmux-#{session_name}-#{window_index}-#{pane_index}-%Y%m%dT%H%M%S.log
#     File path: $HOME (user home dir)
#         Example file: ~/tmux-my-session-0-1-20140527T165614.log

# 2. "Screen Capture"

# Save visible text, in the current pane. Equivalent of a "textual screenshot".

#     Key binding: prefix + alt + p
#     File name format: tmux-screen-capture-#{session_name}-#{window_index}-#{pane_index}-%Y%m%dT%H%M%S.log
#     File path: $HOME (user home dir)
#         Example file: tmux-screen-capture-my-session-0-1-20140527T165614.log

# 3. Save complete history

# Save complete pane history to a file. Convenient if you retroactively remember you need to log/save all the work.

#     Key binding: prefix + alt + shift + p
#     File name format: tmux-history-#{session_name}-#{window_index}-#{pane_index}-%Y%m%dT%H%M%S.log
#     File path: $HOME (user home dir)
#         Example file: tmux-history-my-session-0-1-20140527T165614.log

# https://github.com/tmux-plugins/tmux-logging
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @logging-path "/home/davide/.tmux_history"


# open urls in copymode
# Key bindings

# In tmux copy mode:

#     o - "open" a highlighted selection with the system default program. open for OS X or xdg-open for Linux.
#     Ctrl-o - open a highlighted selection with the $EDITOR
#     Shift-s - search the highlighted selection directly inside a search engine (defaults to google).

set -g @plugin 'tmux-plugins/tmux-open'


# peacock: colors per session
set -g @plugin 'imomaliev/tmux-peacock'


# continuum
# set -g @continuum-restore 'on'
# set -g @plugin 'tmux-plugins/tmux-continuum'


# resurrect
# Key bindings

#     prefix + Ctrl-s - save
#     prefix + Ctrl-r - restore

set -g @plugin 'tmux-plugins/tmux-resurrect'


# session wizard
# Features

# prefix + T (customisable) - displays a pop-up with fzf which displays the existing sessions followed by recently accessed directories (using zoxide). Choose the session or the directory and voila! You're in that session. If the session doesn't exist, it will be created.
set -g @plugin '27medkamal/tmux-session-wizard'

# online status
set -g @plugin 'tmux-plugins/tmux-online-status'


# line setup
set -g status-interval 5
set -g status-right "Online: #{online_status} | %a %h-%d %H:%M "

# set fish as the default shell
set-option -g default-shell /usr/bin/fish



# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'